name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check (headless)
        run: python tests/smoke_test.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build
        run: python build.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: KaoyanPet-Windows
          path: dist/KaoyanPet.exe
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check (headless)
        run: python tests/smoke_test.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build
        run: python build.py

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent KaoyanPet.app KaoyanPet-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: KaoyanPet-macOS
          path: dist/KaoyanPet-macOS.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: KaoyanPet-Windows
          path: dist-win

      - name: Download macOS zip
        uses: actions/download-artifact@v4
        with:
          name: KaoyanPet-macOS
          path: dist-mac

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "自动构建：Windows exe + macOS app"
          artifacts: "dist-win/KaoyanPet.exe,dist-mac/KaoyanPet-macOS.zip"
          allowUpdates: true
          replacesArtifacts: true
